[workspace]
resolver = "3"
members = [
    "crates/focus-core",
    "crates/focus-firmware",
]
default-members = ["crates/focus-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
